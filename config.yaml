# ============================================================
#  FLIGHT TRACKER — CONTROL PANEL
#  Edit values, save, done. Next daily run picks them up.
#  (After GitHub deploy: edit this file on github.com in the browser.)
# ============================================================

route:
  origin: CDG                 # main departure airport
  destination: BLR            # main arrival airport
  origin_alternates: []       # e.g. [ORY] — airports within ~100 km, scanned too (v2)
  destination_alternates: []

trip:
  window_start: 2026-12-05    # trip can start from this date...
  window_end: 2027-01-25      # ...and must be fully over by this date
  trip_days: 40               # exact trip length -> departures Dec 1-12

filters:
  budget_eur: 900             # PLACEHOLDER — set your real cap; options above it are hidden from top list
  max_stops: 1                # 0 = nonstop only
  max_duration_hours: 16      # outbound leg duration cap (list shows outbound; return chosen at booking)
  avoid_layovers: [middle-east]          # airport codes to exclude as connections, and/or the preset "middle-east"
  cabin: economy              # economy | premium-economy | business | first
  adults: 1

notify:
  # Recipients are NOT stored here (public repo) — they live in the repo
  # Actions variable DIGEST_TO, managed from the dashboard's filter drawer.
  alert_threshold_pct: 3      # highlight day-over-day moves bigger than this

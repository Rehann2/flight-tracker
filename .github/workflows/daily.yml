name: daily-scan

on:
  schedule:
    - cron: "30 5 * * *"   # 05:30 UTC daily (~06:30/07:30 Paris)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: playwright install chromium --only-shell --with-deps
      - run: python -u collector.py
      - name: Commit snapshot
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "daily scan $(date -u +%F)"
          git push

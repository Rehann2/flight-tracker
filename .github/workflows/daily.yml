name: daily-scan

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily = 08:00 Paris in summer, 07:00 in winter (cron is UTC-only)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: playwright install chromium --only-shell --with-deps
      - run: python -u collector.py
      - name: Commit snapshot
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || { git commit -m "daily scan $(date -u +%F)"; git pull --rebase -X theirs origin main; git push; }
      - name: Send digest email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_TO: ${{ vars.DIGEST_TO }}
        run: python send_digest.py
